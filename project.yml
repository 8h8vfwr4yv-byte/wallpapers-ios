name: Wallpapers
options:
  bundleIdPrefix: com.muse
  deploymentTarget:
    iOS: "26.0"
targets:
  Wallpapers:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muse.wallpapers
        INFOPLIST_KEY_CFBundleDisplayName: 壁纸
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 把壁纸保存到相册，方便设置为锁屏和主屏幕墙纸。
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
